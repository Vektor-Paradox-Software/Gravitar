# ---------------------------------------------------------------------
# SPEC-18 ProjectUnits for the Postgres oracle harness.
# Separate top-level key from `projects:` on purpose — the two harnesses
# answer different questions. T0 only needs these parsed and listed;
# T1+ fill in the actual oracle execution.
oracle_units:
  - project: smoketest
    unit: self-test
    tree_path: corpus/dirty_missing_column
    metadata_import: "models:Base.metadata"
    env_var: SMOKETEST_DATABASE_URL
    dialects: ["postgres"]
    python: "3.11"
    lockfile: locks/smoketest/self-test/requirements.txt
    extras:
      notes: "placeholder unit for T0 skeleton; no real oracle yet"
