[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gravitar"
version = "0.1.0"
description = "Schema drift detector for SQLAlchemy models and Alembic migrations."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Chad Neipling" }]
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/VXP-Software/Gravitar"
Repository = "https://github.com/VXP-Software/Gravitar"
Issues = "https://github.com/VXP-Software/Gravitar/issues"
Changelog = "https://github.com/VXP-Software/Gravitar/blob/main/CHANGELOG.md"

[project.scripts]
gravitar = "gravitar.cli:main"

[project.optional-dependencies]
django = [
    "django>=4.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "jsonschema>=4.22",
    "types-PyYAML>=6.0",
    "django>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gravitar"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gravitar"]

# Django is an optional extra (gravitar[django]) with no bundled type stubs;
# django-stubs would be its own heavy dependency for a non-core code path.
[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/gravitar"]
